name: private repos badge

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: what can this token see?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- viewer:"
          gh api graphql -f query='{ viewer { login repositories(privacy: PRIVATE, ownerAffiliations: OWNER) { totalCount } } }' || true
          echo "--- user(login):"
          gh api graphql -f query='{ user(login: "sky-is-green") { repositories(privacy: PRIVATE, ownerAffiliations: OWNER) { totalCount } } }' || true
          echo "--- rest /user:"
          gh api /user --jq '{private: .total_private_repos, public: .public_repos}' || true
